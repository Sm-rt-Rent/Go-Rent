spring.application.name=GoRent
server.port=8088

spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL in the console (helpful for debugging your queries)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# FIX: Set these separately so they always apply regardless of env variables
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

# HikariCP connection pool tuning
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis Connection
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL}

# Tell Spring to use Redis as the cache manager
spring.cache.type=redis

#Security Secrets
jwt.secrets = ${JWT_SECRET:c21hcnRyZW50LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0}
app.jwt.algorithm=HS256
app.jwt.symmetric-secret=c21hcnRyZW50LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC0yMDI0
app.jwt.access-token-expiration-ms=900000


#PAYSTACK
paystack.secret.key=${PAY_STACK_SECRET}

#Paystack call back url that redirects to frontend page
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

app.mail.from = ${MAIL_SENDER}

#SMtp
#Email (Brevo SMTP)

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
# PRODUCTION: reduce noise - only log warnings and errors
logging.level.root=WARN
logging.level.com.Vhytor.GoRent=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator
# Only expose health endpoint ? hide all others
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

